[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commerceos"
version = "0.1.0"
description = "A synthetic sports-product search foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["commerceos*"]

[tool.setuptools.package-data]
commerceos = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
